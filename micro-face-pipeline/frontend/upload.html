<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Google Cloud Storage Upload Test</title>

<style>

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f5f5f5;
    margin:40px;
}

.container{

    max-width:700px;

    background:white;

    padding:30px;

    border-radius:10px;

    box-shadow:0 0 15px rgba(0,0,0,.1);

}

input{

    width:100%;

    padding:10px;

    margin-bottom:20px;

}

button{

    padding:12px 30px;

    background:#1a73e8;

    color:white;

    border:none;

    cursor:pointer;

    font-size:16px;

}

button:hover{

    background:#135cbc;

}

pre{

    background:#222;

    color:#00ff88;

    padding:20px;

    overflow:auto;

}

</style>

</head>

<body>

<div class="container">

<h2>Google Cloud Storage Upload Test</h2>

<label>Event ID</label>

<input
id="eventId"
value="test-event-001"
/>

<label>Select Image</label>

<input
id="file"
type="file"
accept="image/*"
/>

<button onclick="uploadImage()">

Upload Image

</button>

<h3>Status</h3>

<pre id="output"></pre>

</div>

<script>

const API="http://localhost:8080";

function print(data){

document.getElementById("output").textContent=

typeof data==="string"

?data

:JSON.stringify(data,null,4);

}

async function uploadImage(){

const file=document.getElementById("file").files[0];

const eventId=document.getElementById("eventId").value;

if(!file){

print("Please choose an image.");

return;

}

try{

print("Requesting Signed URL...");

const linkResponse=await fetch(

API+"/upload-link",

{

method:"POST",

headers:{

"Content-Type":"application/json"

},

body:JSON.stringify({

event_id:eventId,

filename:file.name,

content_type:file.type

})

}

);

if(!linkResponse.ok){

throw new Error(await linkResponse.text());

}

const link=await linkResponse.json();

print("Uploading to Google Cloud Storage...");

const uploadResponse=await fetch(

link.upload_url,

{

method:"PUT",

headers:{

"Content-Type":file.type

},

body:file

}

);

if(!uploadResponse.ok){

throw new Error("Upload Failed");

}

print("Verifying Upload...");

const verifyResponse=await fetch(

API+"/upload-complete",

{

method:"POST",

headers:{

"Content-Type":"application/json"

},

body:JSON.stringify({

upload_id:link.upload_id,

event_id:eventId,

object_name:link.object_name,

filename:file.name,

content_type:file.type

})

}

);

if(!verifyResponse.ok){

throw new Error(await verifyResponse.text());

}

const metadata=await verifyResponse.json();

print(metadata);

}

catch(err){

print(err.toString());

}

}

</script>

</body>

</html>
